{% extends 'base.html' %}
{% block title %}Login | Pharmacy Management{% endblock %}
{% block content %}
<div class="auth-panel">
    <div class="auth-card">
        <h2>Pharmacy Management Login</h2>
        <p>Secure remote access for clinical and operational management.</p>
        <form method="post" class="auth-form">
            <label>
                Username
                <input type="text" name="username" required>
            </label>
            <label>
                Password
                <input type="password" name="password" required>
            </label>
            <button type="submit">Login</button>
        </form>
        <div class="login-note">
            <strong>Demo access:</strong> admin / admin123
        </div>
    </div>
</div>
{% endblock %}
