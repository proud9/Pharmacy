{% extends 'base.html' %}
{% block title %}Product Form | Pharmacy Management{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <span class="eyebrow">Catalog management</span>
        <h2>{% if product and product.id %}Edit product{% else %}Add new product{% endif %}</h2>
    </div>
</div>

<form method="post" class="form-grid">
    <label>
        Product name
        <input type="text" name="name" value="{{ product.name if product else '' }}" required>
    </label>
    <label>
        Category
        <input type="text" name="category" value="{{ product.category if product else '' }}" required>
    </label>
    <label>
        SKU
        <input type="text" name="sku" value="{{ product.sku if product else '' }}" required>
    </label>
    <label>
        Unit price
        <input type="number" step="0.01" name="unit_price" value="{{ product.unit_price if product else '0.00' }}" required>
    </label>
    <label>
        Cost price
        <input type="number" step="0.01" name="cost_price" value="{{ product.cost_price if product else '0.00' }}" required>
    </label>
    <label>
        Stock quantity
        <input type="number" name="stock_qty" value="{{ product.stock_qty if product else 0 }}" required>
    </label>
    <label>
        Reorder level
        <input type="number" name="reorder_level" value="{{ product.reorder_level if product else 0 }}" required>
    </label>
    <label>
        Supplier
        <input type="text" name="supplier" value="{{ product.supplier if product else '' }}">
    </label>
    <label>
        Expiry date
        <input type="date" name="expiry_date" value="{{ product.expiry_date if product and product.expiry_date else '' }}">
    </label>
    <div class="actions-row">
        <button type="submit">Save</button>
        <a href="{{ url_for('inventory') }}" class="button secondary">Cancel</a>
    </div>
</form>
{% endblock %}
